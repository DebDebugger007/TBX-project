[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tbx"
version = "0.1.0"
description = "Cross-dataset tuberculosis screening on the NLM Montgomery and Shenzhen chest X-ray sets"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dl = ["torch>=2.0", "torchvision>=0.15", "timm>=0.9", "grad-cam>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]
