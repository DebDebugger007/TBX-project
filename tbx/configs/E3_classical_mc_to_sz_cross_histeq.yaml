# Phase 6 correction: global histogram equalisation, applied to every image (train and test)
# using only that image's own pixels. Compare against E3_classical_mc_to_sz_cross (no correction)
# with 08_compare_auc.py.
# Needs: python scripts/04_build_features.py --corrections histeq
name: E3_classical_mc_to_sz_cross_histeq
description: lung-field features, LR, histeq, train all of montgomery, test all of shenzhen.
train: montgomery
test: shenzhen
region: whole
model: classical
eval_mode: cross
correction: histeq
model_cfg:
  classical_estimator: logreg
