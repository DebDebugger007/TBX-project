# E4 with region=lung_cropped -- ResNet-18, train shenzhen, test montgomery, cross.
# Cropped to the lung bounding box: removes borders, text, collimation and most non-lung anatomy.
# Montgomery uses its manual masks; Shenzhen uses the U-Net masks from script 03.
name: E4_sz_to_mc_cross_lungcrop
description: ResNet-18, lung_cropped, train shenzhen, test montgomery (cross).
train: shenzhen
test: montgomery
region: lung_cropped
model: resnet18
eval_mode: cross
