# E4 (classical) -- cross-dataset lung-field baseline: train shenzhen, test montgomery once.
# Compare its drop against the CNN's E4: a smaller drop for this lung-only model
# is evidence the CNN relies on cues outside the lungs. Needs 03 + 04 run first.
name: E4_classical_sz_to_mc_cross
description: Lung-field texture features, LR, train all of shenzhen, test all of montgomery.
train: shenzhen
test: montgomery
region: whole          # ignored by the classical model (always lung-field)
model: classical
eval_mode: cross
model_cfg:
  classical_estimator: logreg
