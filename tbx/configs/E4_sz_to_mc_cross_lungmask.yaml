# E4 with region=lung_masked -- ResNet-18, train shenzhen, test montgomery, cross.
# Lungs blacked out, everything else kept: if AUC stays high, the model is using cues outside the lungs.
# Montgomery uses its manual masks; Shenzhen uses the U-Net masks from script 03.
name: E4_sz_to_mc_cross_lungmask
description: ResNet-18, lung_masked, train shenzhen, test montgomery (cross).
train: shenzhen
test: montgomery
region: lung_masked
model: resnet18
eval_mode: cross
