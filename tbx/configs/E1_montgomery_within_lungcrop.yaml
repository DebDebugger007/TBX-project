# E1 with region=lung_cropped -- ResNet-18, train montgomery, test montgomery, within.
# Cropped to the lung bounding box: removes borders, text, collimation and most non-lung anatomy.
# Montgomery uses its manual masks; Shenzhen uses the U-Net masks from script 03.
name: E1_montgomery_within_lungcrop
description: ResNet-18, lung_cropped, train montgomery, test montgomery (within).
train: montgomery
test: montgomery
region: lung_cropped
model: resnet18
eval_mode: within
