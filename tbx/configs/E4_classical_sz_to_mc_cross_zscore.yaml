# Phase 6 correction: per-image z-score intensity normalisation, applied to every image (train and test)
# using only that image's own pixels. Compare against E4_classical_sz_to_mc_cross (no correction)
# with 08_compare_auc.py.
# Needs: python scripts/04_build_features.py --corrections zscore
name: E4_classical_sz_to_mc_cross_zscore
description: lung-field features, LR, zscore, train all of shenzhen, test all of montgomery.
train: shenzhen
test: montgomery
region: whole
model: classical
eval_mode: cross
correction: zscore
model_cfg:
  classical_estimator: logreg
