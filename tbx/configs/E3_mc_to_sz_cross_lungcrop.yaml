# E3 with region=lung_cropped -- ResNet-18, train montgomery, test shenzhen, cross.
# Cropped to the lung bounding box: removes borders, text, collimation and most non-lung anatomy.
# Montgomery uses its manual masks; Shenzhen uses the U-Net masks from script 03.
name: E3_mc_to_sz_cross_lungcrop
description: ResNet-18, lung_cropped, train montgomery, test shenzhen (cross).
train: montgomery
test: shenzhen
region: lung_cropped
model: resnet18
eval_mode: cross
