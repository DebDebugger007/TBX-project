# E1 with region=lung_masked -- ResNet-18, train montgomery, test montgomery, within.
# Lungs blacked out, everything else kept: if AUC stays high, the model is using cues outside the lungs.
# Montgomery uses its manual masks; Shenzhen uses the U-Net masks from script 03.
name: E1_montgomery_within_lungmask
description: ResNet-18, lung_masked, train montgomery, test montgomery (within).
train: montgomery
test: montgomery
region: lung_masked
model: resnet18
eval_mode: within
