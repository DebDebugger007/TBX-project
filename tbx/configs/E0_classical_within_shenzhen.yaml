# E0 (Shenzhen) — classical lung-field baseline, within-set 5-fold on Shenzhen.
# Companion to E0_classical_within.yaml (Montgomery). Kept as its own file so the
# two runs write to separate output folders instead of overwriting each other.
# Shenzhen lung fields come from the U-Net masks (run 03 first).
name: E0_classical_within_shenzhen
description: Texture + intensity features inside the lung field, LR/SVM, 5-fold on SZ.
train: shenzhen
test: shenzhen
region: whole          # ignored by the classical model (always lung-field)
model: classical
eval_mode: within
model_cfg:
  classical_estimator: logreg
