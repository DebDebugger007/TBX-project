# Phase 6 correction: global histogram equalisation, applied to every image (train and test)
# using only that image's own pixels. Compare against E4_classical_sz_to_mc_cross (no correction)
# with 08_compare_auc.py.
# Needs: python scripts/04_build_features.py --corrections histeq
name: E4_classical_sz_to_mc_cross_histeq
description: lung-field features, LR, histeq, train all of shenzhen, test all of montgomery.
train: shenzhen
test: montgomery
region: whole
model: classical
eval_mode: cross
correction: histeq
model_cfg:
  classical_estimator: logreg
